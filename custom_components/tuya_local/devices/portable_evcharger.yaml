name: EV charger

# Single template covering both Smart EV Charger models:
#   - 6-10A portable (hardware enforces 6/8/10A steps internally)
#   - 16A portable  (hardware enforces 6/8/10/12/14/16A steps internally)

products:
  - id: gz7brfamdlvyagvt
    manufacturer: Smart EV Charger
    model: Portable EV Charger
  - id: e1mr37qs
    manufacturer: Smart EV Charger
    model: Portable EV Charger (legacy ID)

entities:
  - entity: switch
    name: Charger
    icon: "mdi:ev-station"
    dps:
      - id: 18
        type: boolean
        name: switch

  - entity: sensor
    name: Status
    class: enum
    icon: "mdi:ev-plug-type2"
    category: diagnostic
    dps:
      - id: 3
        type: string
        name: sensor
        mapping:
          - dps_val: charger_free
            value: Idle
          - dps_val: charger_insert
            value: Connected
          - dps_val: charger_wait
            value: Waiting
          - dps_val: charger_charging
            value: Charging
          - dps_val: charger_pause
            value: Paused
          - dps_val: charger_end
            value: Finished
          - dps_val: charger_fault
            value: Fault
          - dps_val: charger_free_fault
            value: Idle (fault)

  - entity: number
    name: Charge current
    category: config
    class: current
    # Protocol accepts 6-16. Hardware limits:
    #   6-10A model -> only 6/8/10 are accepted by the unit
    #   16A model   -> only 6/8/10/12/14/16 are accepted by the unit
    dps:
      - id: 4
        type: integer
        name: value
        unit: A
        range:
          min: 6
          max: 16

  - entity: select
    name: Charging mode
    category: config
    dps:
      - id: 14
        type: string
        name: option
        mapping:
          - dps_val: charge_now
            value: immediate
          - dps_val: charge_pct
            value: charge_to_percent
          - dps_val: charge_energy
            value: fixed_charge
          - dps_val: charge_schedule
            value: scheduled_charge

  - entity: sensor
    name: Connection state
    class: enum
    icon: "mdi:ev-plug-type2"
    category: diagnostic
    dps:
      - id: 13
        type: string
        optional: true
        name: sensor
        mapping:
          - dps_val: controlpi_12v
            value: Standby
          - dps_val: controlpi_12v_pwm
            value: Communication initialising
          - dps_val: controlpi_9v
            value: Vehicle detected
          - dps_val: controlpi_9v_pwm
            value: Vehicle connected
          - dps_val: controlpi_6v
            value: Charging
          - dps_val: controlpi_6v_pwm
            value: Charging (ventilation)
          - dps_val: controlpi_error
            value: Pilot error

  - entity: sensor
    name: Energy
    class: energy
    dps:
      - id: 1
        type: integer
        optional: true
        name: sensor
        unit: kWh
        class: total_increasing
        mapping:
          - scale: 100

  - entity: sensor
    name: Session energy
    class: energy
    dps:
      - id: 25
        type: integer
        optional: true
        name: sensor
        unit: kWh
        class: total_increasing
        mapping:
          - scale: 100

  - entity: sensor
    name: Temperature
    class: temperature
    category: diagnostic
    dps:
      - id: 24
        type: integer
        optional: true
        name: sensor
        unit: "C"

  - entity: sensor
    name: Charge record
    category: diagnostic
    icon: "mdi:identifier"
    dps:
      - id: 22
        type: string
        optional: true
        name: sensor

  - entity: sensor
    name: Voltage
    class: voltage
    dps:
      - id: 6
        type: base64
        optional: true
        name: sensor
        unit: V
        mask: "FFFF000000000000"
        class: measurement
        mapping:
          - scale: 10

  - entity: sensor
    name: Current
    class: current
    dps:
      - id: 6
        type: base64
        optional: true
        name: sensor
        unit: A
        mask: "0000FFFFFF000000"
        class: measurement
        mapping:
          - scale: 1000

  - entity: sensor
    name: Power
    class: power
    dps:
      - id: 6
        type: base64
        optional: true
        name: sensor
        unit: W
        mask: "0000000000FFFFFF"
        class: measurement

  - entity: binary_sensor
    name: Fault
    class: problem
    category: diagnostic
    dps:
      - id: 28
        type: bitfield
        optional: true
        name: sensor
        mapping:
          - dps_val: 0
            value: false
          - value: true
      - id: 28
        type: bitfield
        optional: true
        name: fault_code
